name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vectors:
    name: Spec vectors are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ticket-spec/reference/requirements.txt
      - run: python gen_vectors.py --check
        working-directory: ticket-spec/reference

  kotlin:
    name: Kotlin ticket-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :ticket-format:test --no-daemon
        working-directory: quarry-app

  dotnet:
    name: C# server (crypto + PostgreSQL integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRUCKGATE_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build TruckGate.slnx -warnaserror:false
        working-directory: server
      - run: dotnet test tests/TruckGate.Crypto.Tests --no-build --logger "console;verbosity=normal"
        working-directory: server
      - run: dotnet test tests/TruckGate.Server.Tests --no-build --logger "console;verbosity=normal"
        working-directory: server
