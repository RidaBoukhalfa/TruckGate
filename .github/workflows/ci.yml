name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vectors:
    name: Spec vectors are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ticket-spec/reference/requirements.txt
      - run: python gen_vectors.py --check
        working-directory: ticket-spec/reference

  kotlin:
    name: Kotlin (ticket-format, quarry-core, Android app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :ticket-format:test :quarry-core:test :app:assembleDebug --no-daemon --stacktrace
        working-directory: quarry-app
      - uses: actions/upload-artifact@v4
        with:
          name: truckgate-quarry-debug-apk
          path: quarry-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  web:
    name: Gate station web UI (TypeScript check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: truckgate-web-wwwroot
          path: server/src/TruckGate.Api/wwwroot/
          if-no-files-found: error

  dotnet:
    name: C# server (crypto + PostgreSQL integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRUCKGATE_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build TruckGate.slnx -warnaserror:false
        working-directory: server
      - run: dotnet test tests/TruckGate.Crypto.Tests --no-build --logger "console;verbosity=normal"
        working-directory: server
      - run: dotnet test tests/TruckGate.Server.Tests --no-build --logger "console;verbosity=normal"
        working-directory: server
